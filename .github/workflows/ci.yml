name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14', '3.15']
        os: [ubuntu-latest]
        include:
          - python: '3.12'
            os: windows-latest
          - python: '3.12'
            os: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      # Bootstrap with the advisory's hash-verified wheel before index access.
      - name: Bootstrap patched pip
        run: >-
          python -m pip --disable-pip-version-check install
          --no-index --no-deps --no-cache-dir
          "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
      - run: python -m pip --disable-pip-version-check install uv==0.13.4
      - run: uv sync --locked --dev --python ${{ matrix.python }} --no-managed-python
      - run: uv run --no-sync pytest
      - run: uv build --wheel
      - run: uv run --no-sync python tests/packaging/check_wheel.py dist

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      # Bootstrap with the advisory's hash-verified wheel before index access.
      - name: Bootstrap patched pip
        run: >-
          python -m pip --disable-pip-version-check install
          --no-index --no-deps --no-cache-dir
          "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
      - run: python -m pip --disable-pip-version-check install uv==0.13.4
      - run: uv sync --locked --dev --python 3.12 --no-managed-python
      - run: uv run --no-sync macrostates check
      - run: uv run --no-sync macrostates change-check
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync pyright
      - run: uv run --no-sync sphinx-build -W --keep-going -b html docs docs/_build/html
      - run: uv build
