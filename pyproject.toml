[build-system]
requires = ["hatchling>=1.27", "PyYAML>=6.0", "packaging>=24.2"]
build-backend = "hatchling.build"

[project]
name = "python-traceprint"
dynamic = ["version"]
description = "Readable print and logging traces with timing, labels, and nesting."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Lucas Lopez" },
]
keywords = ["logging", "tracing", "stdout", "debugging"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Documentation = "https://lll-devs.github.io/python-traceprint/"
Repository = "https://github.com/LLL-Devs/python-traceprint"
Issues = "https://github.com/LLL-Devs/python-traceprint/issues"
Changelog = "https://github.com/LLL-Devs/python-traceprint/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "certifi>=2026.10.19",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "pyright>=1.1",
  "hatchling>=1.27",
  "PyYAML>=6.0",
  "types-PyYAML>=6.0",
  "macrostates-cli==0.5.0",
  "sphinx>=8.2",
  "twine>=6.1",
]

[tool.hatch.metadata.hooks.custom]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/examples", "/docs", "/hatch_build.py", "/.macrostates/implementation/deliverables.yaml", "/.macrostates/implementation/release.yaml", "/.macrostates/specs", "/README.md", "/CONTRIBUTING.md", "/CHANGELOG.md", "/LICENSE", "/pyproject.toml"]
exclude = ["/docs/_build"]

[tool.hatch.build.targets.wheel]
packages = ["src/traceprint"]

[tool.uv]
required-version = ">=0.13.4"
cache-keys = [
  { file = "pyproject.toml" },
  { file = "hatch_build.py" },
  { file = ".macrostates/implementation/deliverables.yaml" },
  { file = "README.md" },
  { dir = "src" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["src", "tests", "hatch_build.py"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

